  # ── 主セット (dominant, 均衡または単一) を登録して straggler だけを候補に残す ──
  #   ※ 各 facet の残り (低カウント別セット) が mismap 候補として WARN に出る。
  "Sun & Moon—Team Up":            # SM9 = タッグボルト (単一)
    - "拡張パック「タッグボルト」"
