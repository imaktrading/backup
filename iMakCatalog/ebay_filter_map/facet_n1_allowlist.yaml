    - "拡張パック「タイムゲイザー」"
  "Sword & Shield—Chilling Reign":
    - "拡張パック「漆黒のガイスト」"
    - "拡張パック「白銀のランス」"
  "Sword & Shield—Battle Styles":
    - "拡張パック「一撃マスター」"
    - "拡張パック「連撃マスター」"
    # 注: 「双璧のファイター」は Battle Styles か別セットか要確認 → allowlist 未登録 (候補で出す)
  # ── XY: 英語1セット = JP 2 半セット ──
  "XY":
    - "拡張パック「コレクションX」"
    - "拡張パック「コレクションY」"
  "XY—Steam Siege":
    - "拡張パック「冷酷の反逆者」"
    - "拡張パック「爆熱の闘士」"
