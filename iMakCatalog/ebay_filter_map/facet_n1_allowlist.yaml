    - "拡張パック「青い衝撃」"
  "XY—Primal Clash":
    - "拡張パック「ガイアボルケーノ」"
    - "拡張パック「タイダルストーム」"
  # ── B&W / D&P / HGSS: 英語1セット = JP 2 半セット ──
  "Black & White":
    - "拡張パック「ブラックコレクション」"
    - "拡張パック「ホワイトコレクション」"
  "Black & White—Dragons Exalted":
