# set_name_ebay の N:1 (複数 JP set → 1 eBay facet) のうち、**正当な半セット結合** allowlist。
#
# 依頼: requests/2026-08-01_hq_decisions_nameguard_facet_fb10049.md ③ (窓口)。
# 目的: N:1 検出 (set_name_integrity_audit の WARN) が、英語1セット=JP2半セットの正当な結合
#   (例 コレクションサン+ムーン → 'Sun & Moon') を **誤検出しない** ための除外リスト。
#
# 規約:
#   - **コードにハードコードしない** (窓口指示)。本 yaml が SSOT。
#   - facet ごとに、その facet に正当に属する set_name_official を列挙。
#   - ここに**無い** JP set が同 facet を持っていたら = mismap 候補として WARN (自動修正はしない)。
#   - 追加は「英語1セット=JP半セット結合」が公式構造で確認できたものだけ。straggler(数枚だけ別セット)
#     は allowlist に足さず、候補として窓口 per-facet GO に回す。
#
# category: pokemon_tcg (現状 pokemon のみ。他カテゴリで N:1 が出たら節を足す)

pokemon_tcg:
  # ── SM / SWSH / SV: 英語1セット = JP 表裏 2 半セット (均衡カウント確認済) ──
  "Sun & Moon":
    - "拡張パック「コレクション サン」"
    - "拡張パック「コレクション ムーン」"
    - "拡張パック「サン&ムーン」"
    - "拡張パック「サン＆ムーン」"
  "Scarlet & Violet—Paradox Rift":
    - "拡張パック「古代の咆哮」"
    - "拡張パック「未来の一閃」"
  "Sword & Shield—Astral Radiance":
