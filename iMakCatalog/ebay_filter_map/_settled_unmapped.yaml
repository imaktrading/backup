# 変換表に足さないと決めた値 (= 決着済み)。`tools/finish_ingest.py` が参照する。
#
# 依頼: `requests/2026-10-02_monthly_settled_values_exclude_go.md` [IMPLEMENT-GO]
#
# なぜ要るか: 仕上げは「変換表に無い値」の件数をそのまま終了コードにしていたので、
# 決着済みの天井が残っているだけで毎月 NG(1) が出て、「月次が失敗している」と
# 読まれていた (総点検の28番がこれ)。ここに載せた値は赤から外し、
# **載っていない新しい値が出た時だけ赤**にする。
#
# ★載せる条件: 「公式に無い」「eBay に当てる先が無い」等の理由で、
#   値を足しても出品が良くならないと確かめたもの。**面倒だから、は理由にならない。**
# ★`why` を必ず書く。書けないものは載せない。

pokemon_tcg:
  stage:
    values: ["V進化", "レベルアップ", "BREAK進化", "復元", "伝説", "V-UNION"]
    rows: 426
    why: >-
      eBay の Stage の一覧は デジモン向けを除くと Basic / Stage 1 / Stage 2 / Mega の4つだけで、
      これらに当てる先が無い (CLAUDE.md「項目の仕分け」)。推測で当てると誤った値になる。
      根拠が変わる条件: eBay の Stage の一覧に該当する値が増えた時。

one_piece_tcg:
  power:
    values: ["-"]
    rows: 928
    why: >-
      公式が `-` と書いている = パワーを持たないカード (イベント / ステージ)。
      `-` を Item Specifics に出す意味が無いので空欄が正しい。

dragonball_scg:
  rarity:
    suffixes: ["★"]
    why: >-
      `★` は刷り違い (パラレル) の印で、公式のレアリティ語彙 (C/U/R/SR/SCR 等) には無い。
      刷り違いの別は Features が持つ。C:Rarity に `SR★` が出るのは誤りなので空欄が正しい
      (ガンダムの `+` と同じ扱い。2026-08-13 の是正と同じ理由)。

gundam_tcg:
  rarity:
    suffixes: ["+"]
    why: >-
      `+` は刷り違い (パラレル) の印で、公式のレアリティ語彙 (C/U/R/LR/LKC/LKU/LKR/P) に無い。
      刷り違いの別は Features が持つ (2026-08-13 是正)。
  ap:
    values: ["-"]
    why: 公式が `-` と書いている = 数値を持たないカード (COMMAND 等)。
  hp:
    values: ["-"]
    why: 公式が `-` と書いている = 数値を持たないカード (COMMAND 等)。
  color:
    values: ["-", "無"]
    rows: 219
    why: >-
      `-` は公式が数値や色を持たないと書いているもの。`無` は UNIT TOKEN
      (T-001〜T-006_BETA の4行) で、トークンなので色が無いのが正しい。

# --- 項目ごと (カテゴリを問わず) ---
# name_en は「英語版が発売されていないので英語名が存在しない」行が毎弾出る。
# 埋める手が無いので赤にはしないが、**件数は必ず出す** (放置と区別するため)。
_fields_reported_not_red:
  name_en:
    why: >-
      日本語版だけの弾 (2026年の アビスアイ / ストームエメラルダ / MEGA プロモ /
      チャンピオンシップ2027 等) のトレーナーズ・スタジアム・エネルギーは、
      英語版が出ていないので英語名が存在しない (CLAUDE.md「埋まらない 33行」)。
      根拠が変わる条件: 英語版が発売された時。
