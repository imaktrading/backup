# ============================================================================
# Rarity (TCG+ API の short code → eBay フィルタ表示値)
# 注: TCG+ API は既に eBay 短縮コード形式 (SR / C / UC 等) を返すので大半は identity 写像。
#     L (Leader) は card type なので rarity としては空欄。
# ============================================================================
rarity:
  # 公式 cardlist (onepiece-cardgame.com / asia-en, 2026-08-13 実取得) の rarity 表示は
  # C / UC / R / SR / SEC / L / SPカード(EN: "SP CARD") の 7 種。
  - source: L
    ebay: Leader
    note: >-
      2026-08-13 是正。旧 L→"" (空欄) は dragonball で 2026-07-21 に是正したのと同型の地雷
      (空欄は fail-closed skip で Leader カードを丸ごと落とす)。products 側は既に 'Leader'。
  - source: C
    ebay: Common
  - source: UC
    ebay: Uncommon
  - source: R
    ebay: Rare
  - source: SR
    ebay: Super Rare
  - source: SEC
    ebay: Secret Rare
  - source: P
    ebay: Promo
    note: Bandai "P" = eBay "Promo"
  - source: TR
    ebay: Treasure Rare
  - source: Special
    ebay: Special
  - source: SP
    ebay: Special
  - source: SPカード
    ebay: Special
    note: >-
      公式 JP 表示 "SPカード" / 公式 EN 表示 "SP CARD" (asia-en cardlist, 2026-08-13 実取得)。
      eBay master (cat 183454) の canonical 57 値に 'SP CARD' は無く 'Special' が実在値なので
      'Special' を採用。旧: 生値 'SPカード' が C:Rarity にそのまま出ていた (118件)。
  # 複合コード '<基底> SP' (SP 再録: SR SP / SEC SP / R SP / SP P) は個別登録しない。
  # api.rarity_lookup_keys() が基底コード側 (SR / SEC / R / P) を引く。
  # HQ 裁定 2026-08-18 requests/2026-08-13_rarity_17rows_naming_decision_req_response.md
  # 「SP 単独 (SP / SPカード) だけ Special」= 上の 2 entry がそれ。
  - source: DON!!
    ebay: DON!!
