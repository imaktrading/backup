# One Piece Card Game — eBay フィルタ値マッピング
#
# 出典: iMakTCG/psa_to_csv.py の _ONEPIECE_SET_NAME_MAP / _onepiece_rarity_to_ebay
#       (2026-04-25 時点でユーザーが eBay フィルタ値を確認済み)
#
# 注意:
#   - source_value は scraper が DB に書く値と完全一致させる
#       set      : set_name_official (公式原文の booster 名そのもの)
#       set_code : 公式原文の角括弧内 (例: "OP-06") — set fallback として api._row_to_dict が抽出
#       rarity   : TCG+ API の card_config.Rarity short code (L/C/UC/R/SR/SEC/...)
#   - 新弾追加時は本ファイルに 1 行足して `python ebay_filter_map/loader.py one_piece` で再ロード
#   - eBay の C:Set フィルタ表示が変わっていないか半年に一度ぐらい目視確認

category: one_piece_tcg

# ============================================================================
# Set (公式原文ベタ一致) — bracket [XX-NN] 抽出が効かない汎用ラベル用
# ============================================================================
set:
  # Promo / Misc ラベル — どれも eBay では "Promo Cards" にまとめられる想定
  - source: Promotion Card
    ebay: Promo Cards
    note: REVIEW eBay 値
  - source: Other Product Card
    ebay: Promo Cards
    note: REVIEW eBay 値
  - source: プロモーションカード
    ebay: Promo Cards
    note: JA 'Promotion Card'
  - source: 限定商品収録カード
    ebay: Promo Cards
    note: JA 'Limited Product Card' — REVIEW eBay 値
  - source: プレミアムカードコレクション -GIRLS EDITION-
    ebay: Promo Cards
    note: 2026-07-10 Premium Card Collection Girls Edition (ST07-008_GE 等 parallel)
  # 2026-07-29 live cert set_name_ebay 欠損 (214KEY残36の一部)。既存 promo/event と同じ Promo Cards バケツ。
  - source: プレミアムカードコレクション 25周年エディション
    ebay: Promo Cards
    note: 25th Anniversary Edition Premium Card Collection (OP01-001_p1 / ST01-006_p1 等)。REVIEW eBay 値
  - source: プレミアムカードコレクション ‐ONE PIECE FILM RED ‐
    ebay: Promo Cards
    note: Premium Card Collection FILM RED (OP01-017_p2 / ST01-013_p3 等)。既存同setで Promo Cards 実績あり
  - source: スタンダードバトル 2024年1月優勝記念品
    ebay: Promo Cards
    note: Standard Battle 優勝記念品 (event prize promo, OP03-044_p2)。REVIEW eBay 値
  - source: フラッグシップバトル2025 10月ベスト8記念品
    ebay: Promo Cards
    note: Flagship Battle 記念品 (event prize promo, OP12-031_p2)。REVIEW eBay 値
  # 2026-07-31 Advisor GO: audit_catalog_fix_tcg_response.md ① — 13件に効く
  # (set_name_official='プロモーションカードセット' 全13行の set_name_ebay 空欄が埋まる)
  - source: プロモーションカードセット
    ebay: Promo Cards
    note: JA 'Promotion Card Set' promo bucket (OP02-059_p2 Boa Hancock 等 13件)
  # 2026-07-31 Advisor GO: pdca_catalog_queue_tcg_response.md A-1 — 14件に効く
  # (PERONA cert153420191 が missing_models.csv に 4日居座り prune=0 だった真因)
  - source: 始めようキャンペーン プロモーションパック
    ebay: Promo Cards
    note: JA "Let's Start Campaign Promotion Pack" promo (OP01-077_p4/p5 等 14件)
  # 2026-07-30 revert: `2nd ANNIVERSARY SET → 500 Years in the Future` を削除
  # (commit 8a8f428 の一部 revert)。理由: 同 set_name_official の 54件内訳は
  # blank 34 / 500Years 7 / Dual Evolution 5 / DON 2 / 他 = 箱名から一意 eBay facet
  # 決まらず = mapping 誤り。埋めるには eBay facet 実確認が必要 (Wings/Promo 候補)。
  # 詳細: iMak_data/catalog/requests/2026-07-29_live_key_214_verdicts_response.md

  # Vision OCR 由来の長文セット名 (PSA カード上の印刷名、bracket [...] 抜き)
  # 旧 psa_to_csv._ONEPIECE_SET_NAME_MAP の Vision エントリから移植
  - source: PREMIUM BOOSTER -ONE PIECE CARD THE BEST-
    ebay: Premium Booster One Piece The Best
    note: Vision OCR (PRB-01)
  - source: PREMIUM BOOSTER -ONE PIECE CARD THE BEST- VOL.2
    ebay: Premium Booster Vol.2
    note: Vision OCR (PRB-02)
  - source: PREMIUM BOOSTER ONE PIECE CARD THE BEST
    ebay: Premium Booster One Piece The Best
    note: Vision OCR variant (PRB-01, no hyphens)
  - source: PREMIUM BOOSTER ONE PIECE CARD THE BEST VOL.2
    ebay: Premium Booster Vol.2
    note: Vision OCR variant (PRB-02, no hyphens)

