# ============================================================================
# Rarity (TCG+ API short code → eBay フィルタ表示値)
# 過去の bandai_tcg_plus.py GUNDAM_RARITY_MAP を参考
# ============================================================================
rarity:
  # 公式 gundam-gcg.com の rarity filter = C / U / R / LR / LKC / LKU / LKR / P の 8 値のみ
  # (2026-08-13 実取得)。'+' は刷り違い (parallel) マーカーで公式 rarity ではないため
  # api.derive_rarity_ebay() が落としてから本 map を引く (意味は Features='Alternative Art')。
  - source: C
    ebay: Common
  - source: U
    ebay: Uncommon
  - source: R
    ebay: Rare
  - source: LR
    ebay: Legend Rare
    note: >-
      公式 EN 商品ページ (gundam-gcg.com/en/products/gd01.html, 2026-08-13 実取得) が
      "Legend Rare" と明記。旧 'Leader Rare' は One Piece の LR の意味を持ち込んだ誤りで是正。
      Gundam に Leader カードは存在しない (Unit/Pilot/Command/Base)。
  - source: SR
    ebay: Super Rare
  - source: SPLR
    ebay: Legend Rare
    note: SP 商品収録の LR。刷り違いなので rarity は LR、SP の別は Features/set 側で表現
  - source: SPR
    ebay: Rare
    note: SP 商品収録の R
  - source: SPU
    ebay: Uncommon
    note: SP 商品収録の U
  - source: P
    ebay: Promo
