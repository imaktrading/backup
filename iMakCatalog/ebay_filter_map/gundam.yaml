# Gundam Card Game — eBay フィルタ値マッピング
#
# 出典: 2026-04-27 --full scrape 完走後の実 DB 値から確定
#
# 注意:
#   - source_value は scraper が DB に書く値と完全一致させる
#   - 新弾追加時は本ファイルに 1 行足して `python ebay_filter_map/loader.py gundam` で再ロード

category: gundam_tcg

# ============================================================================
# Set (公式原文ベタ一致)
# ============================================================================
set:
  # Promo / Misc ラベル
  - source: Promotion Card
    ebay: Promo Cards
    note: REVIEW eBay 値
  - source: プロモーションカード
    ebay: Promo Cards
    note: JA 'Promotion Card'
  - source: 限定商品収録カード
    ebay: Promo Cards
    note: >-
      2026-07-07 HQ依頼: プレミアムグッズセット等 限定商品収録の RESOURCE カード(RP-024〜043)。
      eBay Set facet は非booster配布カードを一律 Promo Cards に束ねる(プロモと同バケツ)。
  - source: プレミアムグッズセット-新機動戦記ガンダムW-[PB01]
    ebay: Promo Cards
    note: >-
      2026-07-24 HQ依頼: PB01 プレミアムグッズセット(ガンダムW)再録カード(GD01-100_PB01 /
      ST02-010_PB01 等)。この set_name_official が未登録だと _row_to_dict が product_id prefix
      (ST02/GD01)へ fallback し base 弾名(Wings of Advance 等)を返して PSA brand(PB01)と不一致→
      selfcheck 拒否。限定商品と同じ Promo Cards バケツに正規化して整合させる。
  - source: リミテッドBOX Ver.β
    ebay: Limited Box Beta Ver.
    note: JA-only Limited Box β — REVIEW eBay 値
  - source: Edition Beta
    ebay: Edition Beta
    note: REVIEW eBay 値

