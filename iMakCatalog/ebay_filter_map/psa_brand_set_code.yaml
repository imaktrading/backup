# PSA のセット名 (Brand) → catalog の set_code (product_id の頭)
# 作成 2026-09-22 / 依頼 requests/2026-09-22_psa_brand_set_code_table.md
#
# 根拠: products の set_name_official (公式の取り込み値) を 2026-09-22 に引き、
#       PSA 表記の日本語セット名と一致する set_code を採った。推測で埋めない。
#
# set_codes の読み方
#   1つ         … そのセットの行は product_id がこの頭で始まる
#   2つ以上     … 同じ商品に別の頭の行が入っている (再録・プロモ同梱)。頭だけでは1枚に決まらない。
#                 番号 (PSA の #) と組んで各 set_code に当て、1件だけ当たった時に採ること
#   []          … 決められない。status に理由
#
# status
#   ok             … 使ってよい
#   multi          … 上の「2つ以上」
#   not_in_catalog … catalog にそのセットの行が無い
#   out_of_scope   … 扱わない商材 (DB ヒーローズ / DIVERS / いたジャガ / 英語版カード)

