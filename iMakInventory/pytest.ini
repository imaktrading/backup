[pytest]
markers =
    offline: scraper detection tests using saved HTML samples (no network, fast).
             Used for cycle precheck (run_cycle.py の Phase 7a) — DOM 仕様変更を
             cycle 開始前に検知して fail-closed で巡回停止する。
    live: tests hitting live URLs (network required, slow).
          通常 CI で skip、運用前 manual smoke で実行。

# ★ 2026-08-13: live を既定で除外する (上の「通常 CI で skip」を実際に効かせる)。
#   live test は網 + chrome profile を要求するため、巡回 (HIGH/LOW が 1 日 9 回、各 1h 超)
#   と重なると driver 起動できず落ちる。pre-commit がこれを走らせていたため、commit の可否が
#   巡回タイミング次第という非決定的な gate になっていた (2026-08-13 実測: 単独実行 36 passed、
#   巡回中の全件実行では同じ test が 11 failed)。
#   実行したい時: pytest -m live （コマンドラインの -m が addopts を上書きする）
addopts = -m "not live"
