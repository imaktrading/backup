  - {max_usd: 300,   target_profit: 0.10, gap_limit: 0.40}  # $200-300:利益10%, 乖離40%
  - {max_usd: 400,   target_profit: 0.10, gap_limit: 0.25}  # $300-400:利益10%, 乖離25%
  - {max_usd: 500,   target_profit: 0.10, gap_limit: 0.20}  # $400-500:利益10%, 乖離20%
  - {max_usd: 600,   target_profit: 0.10, gap_limit: 0.15}  # $500-600:利益10%, 乖離15%
  - {max_usd: 800,   target_profit: 0.10, gap_limit: 0.10}  # $600-800:利益10%, 乖離10%
