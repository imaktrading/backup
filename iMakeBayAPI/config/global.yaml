# ------------------------------------------------
# 相場取得 / AI総合レビュー のスイッチ (2026-08-13 ユーザー確定で停止)
# ------------------------------------------------
# market_lookup: eBay の相場 (中央値/競合数) を取りに行くか。
#   ★停止した理由 (実測):
#     - 価格は cost-plus (pricing_engine) で決まっており、相場は**価格に影響しない**
#     - 相場を理由に出品を止めた実績は **81走行645行で0件**。最後の NO-GO は 2026-05-11
#       (その後「全て出品」方針に変わり、gate は死んでいた)
#     - 記録先の market_log.csv は 1,848行貯めて一度も使っていない
#   → 生成 / check_csv / CSV監査くん の3か所とも、この1か所で止める。
#     再開したくなったら true に戻すだけ (コードは残してある)。
market_lookup:
  enabled: false

# ai_review: Claude による「AI総合レビュー」(バッチ全体の講評) を出すか。
#   ★停止した理由: 講評が **post_title_fix で直る前の値**を見ており、
#     「81字で超過」「2022を削れ」など既に解決済みの指摘を毎回85行出していた。
ai_review:
  enabled: false

